<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jaturapat Sutachai (Ed) – Writer</title>
<meta name="description" content="Portfolio and CV of Jaturapat Sutachai (Ed), writer based in Chiang Mai. / พอร์ตโฟลิโอและ CV ของจตุรภัทร สุตะชัย นักเขียน เชียงใหม่">
<meta name="theme-color" content="#E3E3E1">
<meta property="og:title" content="Jaturapat Sutachai (Ed) – Writer">
<meta property="og:description" content="Interviews, news and articles. Portfolio and CV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Noto+Serif+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* hub (home page) */
  --hub-bg: #E3E3E1; --hub-fg: #141414; --hub-muted: #6F6F6C; --hub-line: rgba(0, 0, 0, .4); --hub-hover: rgba(0, 0, 0, .08);
  /* highlighted words */
  --mark: transparent; --mark-fg: #141414; --mark-hover: #BEBEBB;
  /* overlay sheets */
  --paper: #F4F4F2; --ink: #141414; --muted: #6B6B68; --line: rgba(0, 0, 0, .14);
  --scrim: rgba(40, 40, 38, .45); --shadow: rgba(0, 0, 0, .25); --accent: #555;
  /* type: Baskerville-style serif for reading, Plex Sans Thai for UI, Plex Mono for small labels */
  --serif: "Libre Baskerville", "Noto Serif Thai", "Baskerville", "Caladea", "Loma", Georgia, serif;
  --sans: "IBM Plex Sans Thai", "Loma", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.22, .8, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--hub-bg); }
html.locked { overflow: hidden; }
body { margin: 0; font-family: var(--sans); color: var(--hub-fg); background: var(--hub-bg); font-size: 1rem; line-height: 1.55; }
html[lang="th"] body { line-height: 1.7; }
img { max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--hub-fg); outline-offset: 3px; }
.sheet :focus-visible { outline-color: var(--ink); }

/* ---------- hub ---------- */
#hub { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto auto; gap: 32px; padding: clamp(20px, 4vw, 56px); }
.top { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 14px; color: inherit; text-decoration: none; }
.who img { width: 56px; height: 56px; object-fit: cover; display: block; background: #000; }
.who-text { display: grid; line-height: 1.3; }
#who-name { font-family: var(--serif); font-size: 1.15rem; font-weight: 500; }
#who-role { font-size: .88rem; color: var(--hub-muted); }
.tools { display: flex; align-items: center; gap: 22px; }
.lang { display: flex; border: 1px solid var(--hub-line); }
.lang button { background: none; border: 0; padding: 5px 13px; font: 500 .8rem/1.5 var(--mono); }
.lang button[aria-pressed="true"] { background: var(--hub-fg); color: var(--hub-bg); }
.lang button:not([aria-pressed="true"]):hover { background: var(--hub-hover); }
.cvlink { color: var(--hub-fg); font: .85rem/1.5 var(--mono); text-underline-offset: .25em; text-decoration-thickness: 1px; }
.cvlink:hover { text-decoration-thickness: 2px; }

.stage { display: flex; align-items: center; }
.prose { margin: 0; max-width: 21em; font-family: var(--serif); font-weight: 400; font-size: clamp(1.7rem, 1rem + 3.3vw, 3.6rem); line-height: 1.2; letter-spacing: -.025em; text-wrap: pretty; outline: none; }
html[lang="th"] .prose { line-height: 1.5; letter-spacing: 0; }
.mark {
  color: inherit; text-decoration: none; padding: 0; margin: 0;
  border-bottom: .06em solid currentColor;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
  transition: background-color .25s var(--ease), color .25s var(--ease);
  animation: mark-in .9s var(--ease) backwards; animation-delay: calc(.4s + var(--i, 0) * .3s);
}
.mark:hover { background: var(--hub-fg); color: var(--hub-bg); }
@keyframes mark-in { from { border-bottom-color: transparent; opacity: .35; } to { border-bottom-color: currentColor; opacity: 1; } }

.index { display: flex; flex-wrap: wrap; gap: 6px 26px; }
.index a { color: var(--hub-fg); font: .85rem/1.6 var(--mono); text-decoration-color: var(--hub-line); text-underline-offset: .28em; }
.index a:hover { text-decoration-color: var(--hub-fg); }
#hub-foot { font: .75rem/1.5 var(--mono); color: var(--hub-muted); margin: 0; }

/* ---------- overlays ---------- */
.scrim { position: fixed; inset: 0; z-index: 10; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .45s var(--ease); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 20; width: min(980px, 100%);
  display: flex; flex-direction: column; background: var(--paper); color: var(--ink); outline: none;
  transform: translateX(104%); visibility: hidden; box-shadow: -24px 0 60px var(--shadow);
  transition: transform .55s var(--ease), visibility 0s linear .55s;
}
#sheet2 { z-index: 30; }
.sheet.open { transform: none; visibility: visible; transition-delay: 0s; }
.sheet.under { transform: translateX(-3.5%); filter: brightness(.9); }
.sheet-bar { display: flex; align-items: center; gap: 16px; padding: 12px clamp(20px, 4vw, 40px); border-bottom: 1px solid var(--line); background: var(--paper); }
.sheet-crumb { flex: 1; margin: 0; min-width: 0; font: .8rem/1.5 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-back { background: none; border: 0; padding: 6px 0; font-size: .92rem; font-weight: 500; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
.sheet-back:hover { background: var(--ink); color: var(--paper); }
.sheet-close { background: none; border: 1px solid var(--ink); padding: 5px 16px; font: 500 .8rem/1.5 var(--mono); border-radius: 0; }
.sheet-close:hover { background: var(--ink); color: var(--paper); }
.sheet-scroll { flex: 1; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sheet-inner { max-width: 780px; padding: clamp(26px, 5vw, 60px) clamp(20px, 4vw, 48px) 110px; }

.sheet a:not(.btn):not(.work) { color: inherit; text-decoration-color: currentColor; text-decoration-thickness: 1px; text-underline-offset: .18em; }
.sheet a:not(.btn):not(.work):hover { background: var(--ink); color: var(--paper); }
.display { margin: 0 0 .35em; font-family: var(--serif); font-weight: 400; font-size: clamp(2.2rem, 1.4rem + 3vw, 3.7rem); line-height: 1.1; letter-spacing: -.025em; text-wrap: balance; }
html[lang="th"] .display { line-height: 1.3; letter-spacing: 0; }
.sub { margin: 0 0 1.6em; color: var(--muted); }
.h2 { display: block; width: 100%; margin: 2.6em 0 .9em; padding-bottom: .45em; border-bottom: 2px solid var(--ink); font: 500 .8rem/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.h3 { margin: 0 0 .5em; font: 600 .92rem/1.4 var(--sans); color: var(--muted); }
.empty { color: var(--muted); }
.tag { display: inline-block; padding: 0 9px; border: 1px solid currentColor; border-radius: 0; font: 500 .72rem/1.7 var(--mono); letter-spacing: .02em; white-space: nowrap; }
.btn { display: inline-block; padding: 12px 22px; border: 0; border-radius: 0; background: var(--ink); color: var(--paper); font: 600 .95rem/1.3 var(--sans); text-decoration: none; }
.btn:hover { background: var(--accent); }
.sheet .btn:focus-visible { outline-offset: 3px; }

.about { display: grid; grid-template-columns: 200px 1fr; gap: 32px; align-items: start; }
.about-photo { width: 200px; height: 200px; object-fit: cover; display: block; background: #000; }
.prose-body p, .read-body p { margin: 0 0 1.1em; }
.prose-body { font-family: var(--serif); font-size: 1.08rem; line-height: 1.75; max-width: 36em; }
html[lang="th"] .prose-body { line-height: 1.95; }
.facts { display: grid; gap: 10px 0; margin: 0; }
.facts > div { display: grid; grid-template-columns: 11rem 1fr; gap: 6px 24px; padding: 10px 0; border-top: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: .92rem; }
.facts dd { margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 1.4em 0 .4em; }
.chip { background: none; border: 1px solid var(--ink); border-radius: 0; padding: 5px 15px; font: 500 .8rem/1.5 var(--mono); }
.chip:hover { background: var(--hub-bg); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.works-list { list-style: none; margin: 0; padding: 0; }
.works-list li { border-top: 1px solid var(--line); }
.works-list li:last-child { border-bottom: 1px solid var(--line); }
.work { display: grid; gap: 8px; padding: 22px 0; color: inherit; text-decoration: none; }
.work-title { width: fit-content; font-family: var(--serif); font-size: clamp(1.35rem, 1.1rem + 1vw, 1.8rem); line-height: 1.25; font-weight: 500;
  text-decoration: underline; text-decoration-color: transparent; text-decoration-thickness: .06em; text-underline-offset: .14em; transition: text-decoration-color .25s var(--ease); }
html[lang="th"] .work-title { line-height: 1.45; }
.work:hover .work-title, .work:focus-visible .work-title { text-decoration-color: currentColor; }
.work-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 0; font: .8rem/1.6 var(--mono); color: var(--muted); }
.work-sum { color: var(--muted); max-width: 38em; }

.read .work-meta { margin-bottom: 1.1em; }
.read-sum { font-size: 1.15rem; color: var(--muted); max-width: 34em; margin: 0 0 1.8em; }
.read-cover { display: block; width: 100%; max-height: 420px; object-fit: cover; margin: 0 0 2em; }
.read-pic { display: block; width: 100%; height: auto; margin: 0 0 1.4em; background: rgba(0, 0, 0, .06); }
.read-body { font-family: var(--serif); font-size: 1.14rem; line-height: 1.8; max-width: 34em; margin-bottom: 2em; }
html[lang="th"] .read-body { line-height: 2; }

.timeline { list-style: none; margin: 1.4em 0 0; padding: 0; }
.timeline > li { display: grid; grid-template-columns: 10.5rem 1fr; gap: 6px 24px; padding: 20px 0; border-top: 1px solid var(--line); }
.timeline > li:last-child { border-bottom: 1px solid var(--line); }
.when { color: var(--muted); font: .8rem/1.6 var(--mono); font-variant-numeric: tabular-nums; padding-top: .4em; }
.org { margin: 0; font-family: var(--serif); font-size: 1.3rem; line-height: 1.3; font-weight: 500; }
.role { margin: .15em 0 0; }
.note { margin: .15em 0 0; color: var(--muted); font-size: .95rem; }
.skill-group { margin-bottom: 1.4em; }
.skills { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.skills li { padding: 5px 14px; border: 1px solid var(--ink); border-radius: 0; font: .82rem/1.5 var(--mono); }

.contact-list { list-style: none; margin: 1.6em 0 2.4em; padding: 0; }
.contact-list li { display: grid; grid-template-columns: 8rem 1fr; gap: 4px 24px; padding: 18px 0; border-top: 1px solid var(--line); align-items: baseline; }
.contact-list li:last-child { border-bottom: 1px solid var(--line); }
.c-label { color: var(--muted); font: .8rem/1.6 var(--mono); }
.c-value { font-family: var(--serif); font-size: clamp(1.2rem, 1rem + 1vw, 1.7rem); line-height: 1.35; overflow-wrap: anywhere; }

.cv-tools { display: grid; gap: 12px; justify-items: start; margin: 1.2em 0 0; }
.hint { margin: 0; color: var(--muted); font-size: .92rem; max-width: 40em; }
.cv-stage { position: relative; margin-top: 28px; overflow: hidden; }
.cv-scale { width: 793.7px; transform-origin: 0 0; }
.cv-stage .paper { box-shadow: 0 1px 2px rgba(18, 18, 43, .12), 0 12px 32px rgba(18, 18, 43, .14); }

/* ---------- the CV page (screen preview and print) ---------- */
.paper { width: 210mm; min-height: 297mm; padding: 13mm 14mm; background: #fff; color: #141414; font: 9.4pt/1.5 var(--sans); }
.paper img { display: block; object-fit: cover; background: #000; }
.paper h1 { margin: 0; font: 500 27pt/1.15 var(--serif); }
.paper h1 em { font-style: normal; font-weight: 400; }
.p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10mm; padding-bottom: 7mm; border-bottom: .35mm solid #141414; }
.p-head p { margin: 2mm 0 0; font-size: 10.5pt; color: #666663; }
.p-head img { width: 28mm; height: 28mm; flex: none; }
.p-cols { display: grid; grid-template-columns: 56mm 1fr; gap: 10mm; margin-top: 7mm; }
.paper section { margin-bottom: 6.5mm; }
.paper h2 { display: block; width: fit-content; margin: 0 0 3mm; font: 500 8.4pt/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; background: linear-gradient(transparent 52%, #DADAD8 52%); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.paper h3 { margin: 0 0 1mm; font: 600 8.4pt/1.4 var(--sans); color: #666663; }
.p-list, .p-plain { list-style: none; margin: 0; padding: 0; }
.p-list li { margin-bottom: 2.2mm; overflow-wrap: anywhere; }
.p-list li span { display: block; font-size: 7.8pt; color: #666663; }
.p-plain { margin-bottom: 2.5mm; }
.p-item { margin-bottom: 3.6mm; break-inside: avoid; }
.p-row { display: flex; justify-content: space-between; gap: 6mm; align-items: baseline; }
.p-row strong { font: 500 10.5pt/1.35 var(--serif); }
.p-row span { white-space: nowrap; color: #666663; font-size: 8.6pt; }
.p-sub { font-size: 9pt; }
.p-bio p { margin: 0 0 2mm; }

#print-root { display: none; }
@page { size: A4; margin: 0; }
@media print {
  html, body { background: #fff !important; }
  html.locked { overflow: visible; }
  #hub, .scrim, .sheet { display: none !important; }
  #print-root { display: block; }
  #print-root .paper { box-shadow: none; }
}

@media (max-width: 760px) {
  .sheet { width: 100%; transform: translateY(100%); box-shadow: none; }
  .sheet.under { transform: none; filter: none; }
  .about { grid-template-columns: 1fr; gap: 20px; }
  .about-photo { width: 140px; height: 140px; }
  .facts > div, .timeline > li, .contact-list li { grid-template-columns: 1fr; }
  .tools { gap: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .sheet, .scrim, .work-title { transition: none; }
  .mark { animation: none; }
}
</style>
</head>
<body>
<main id="hub">
  <header class="top">
    <a class="who" href="#/about" data-route>
      <img id="portrait" src="assets/portrait.jpg" alt="" width="56" height="56">
      <span class="who-text"><span id="who-name"></span><span id="who-role"></span></span>
    </a>
    <div class="tools">
      <div class="lang" id="lang-group" role="group" aria-label="Language">
        <button type="button" data-lang="th" aria-pressed="false">ไทย</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="cvlink" id="cv-link" href="#/cv" data-route>CV</a>
    </div>
  </header>
  <section class="stage"><p class="prose" id="hub-prose" tabindex="-1"></p></section>
  <nav class="index" id="hub-nav"></nav>
  <p id="hub-foot"></p>
  <noscript><p>This site needs JavaScript. Jaturapat Sutachai (Ed), writer, Chiang Mai: theboywholive@hotmail.com</p></noscript>
</main>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="sheet1" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" aria-hidden="true">
  <div class="sheet-bar">
    <p class="sheet-crumb"></p>
    <button type="button" class="sheet-close">Close</button>
  </div>
  <div class="sheet-scroll"><div class="sheet-inner"></div></div>
</div>

<div class="sheet" id="sheet2" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" aria-hidden="true">
  <div class="sheet-bar">
    <button type="button" class="sheet-back">Back</button>
    <p class="sheet-crumb"></p>
    <button type="button" class="sheet-close">Close</button>
  </div>
  <div class="sheet-scroll"><div class="sheet-inner"></div></div>
</div>

<div id="print-root" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="fallback.js"></script>
<script src="app.js"></script>
</body>
</html>
